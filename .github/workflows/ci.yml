# Formatting, lint, tests and a package build on every push and pull request.
# No bots, no secrets, no publishing: the built .vsix is kept as a downloadable run artifact.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Python format and lint (Ruff)
        run: |
          pip install --disable-pip-version-check "ruff==0.16.8"
          ruff format --check .
          ruff check .

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md" "#dist" "#private" "#node_modules"

      - name: JSON and JavaScript syntax
        run: |
          for f in package.json palettes/palettes.json .vscode/*.json .markdownlint.json; do
            python -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done
          node --check extension.js

      - name: Unit tests (Python)
        run: python -m unittest discover -s test -v

      - name: Unit tests (extension)
        run: node --test test/extension.test.js

      - name: Generated CSS is up to date
        run: |
          python scripts/build.py css
          git diff --exit-code media/preview.css

      - name: Build package
        run: |
          python scripts/build.py package
          python -m zipfile -l dist/*.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: dist/*.vsix
          retention-days: 30
